async function getPdfData() {
  try {
    const res = await fetch("will-karpf-resume.pdf");
    if (res.ok) return await res.arrayBuffer();
  } catch (e) {}
  const binary = atob(RESUME_B64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

async function renderPdf() {
  const container = document.getElementById("pdf-container");
  try {
    const data = await getPdfData();
    const pdf = await pdfjsLib.getDocument({ data }).promise;
    container.innerHTML = "";
    const maxW = Math.min(container.clientWidth - 8, 920);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (let n = 1; n <= pdf.numPages; n++) {
      const page = await pdf.getPage(n);
      const base = page.getViewport({ scale: 1 });
      const displayScale = maxW / base.width;
      const vp = page.getViewport({ scale: displayScale * dpr });
      const canvas = document.createElement("canvas");
      canvas.width = vp.width;
      canvas.height = vp.height;
      canvas.style.width = Math.floor(base.width * displayScale) + "px";
      canvas.style.height = Math.floor(base.height * displayScale) + "px";
      container.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    }
  } catch (e) {
    container.innerHTML = '<div class="error"><h2>Could not load resume</h2><p>Try downloading the PDF instead.</p><a class="btn btn-primary" href="will-karpf-resume.pdf" download="Will-Karpf-Resume.pdf">Download PDF ↓</a></div>';
  }
}

renderPdf();
window.addEventListener("resize", () => { clearTimeout(window._rt); window._rt = setTimeout(renderPdf, 200); });
</script>
